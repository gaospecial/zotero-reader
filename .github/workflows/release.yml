name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            rust_target: aarch64-apple-darwin
            build_args: --bundles dmg --target aarch64-apple-darwin
            artifact_name: zotero-reader-macos-aarch64
            asset_path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            build_args: --bundles nsis
            artifact_name: zotero-reader-windows-x64
            asset_path: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.artifact_name }}

      - name: Install dependencies
        run: npm ci

      - name: Build desktop installer
        run: npm run desktop:build -- ${{ matrix.build_args }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: zotero-reader-*
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Zotero Reader ${{ github.ref_name }}
          body: |
            ## Downloads

            - **macOS**: DMG installer for Apple Silicon (aarch64)
            - **Windows**: NSIS installer for 64-bit Windows (x64)
          generate_release_notes: true
          files: release-assets/**/*
          fail_on_unmatched_files: true
